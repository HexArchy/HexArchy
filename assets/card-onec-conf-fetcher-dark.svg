<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 418 172" width="418" height="172" role="img" aria-label="onec-conf-fetcher — NetExec module that collects and parses 1C Enterprise configuration files over SMB."><title>onec-conf-fetcher — NetExec module that collects and parses 1C Enterprise configuration files over SMB.</title><style>.rise{animation:rise .8s cubic-bezier(.2,.9,.3,1) backwards}
