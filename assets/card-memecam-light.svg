<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 418 172" width="418" height="172" role="img" aria-label="memecam — Face and hand gestures become cat memes, live in any call via a virtual camera."><title>memecam — Face and hand gestures become cat memes, live in any call via a virtual camera.</title><style>.rise{animation:rise .8s cubic-bezier(.2,.9,.3,1) backwards}
@keyframes rise{from{transform:translateY(1150px)}}
