.nudge{animation:nudge 2.4s cubic-bezier(.2,0,.38,.9) infinite}
@keyframes nudge{0%,60%,100%{transform:none}30%{transform:translateY(4px)}}
.nudgex{animation:nudgex 2.4s cubic-bezier(.2,0,.38,.9) infinite}
